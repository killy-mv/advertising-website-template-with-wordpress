# ---------------------------------------------------------------------------
# Full-page cache (layer 2): Nginx stores rendered HTML from PHP-FPM on disk.
# ---------------------------------------------------------------------------

# 32 MB of keys in RAM (~250k pages), up to 512 MB of HTML on disk.
fastcgi_cache_path /var/cache/nginx/wp levels=1:2 keys_zone=WORDPRESS:32m
                   max_size=512m inactive=24h use_temp_path=off;

# Cache key. The WordPress purge plugin (mu-plugins/page-cache.php) rebuilds
# this exact string to find and delete a page's cache file: keep them in sync.
fastcgi_cache_key "$request_method$host$request_uri";

# Serve the old copy while one request refreshes it, or if PHP is down.
fastcgi_cache_use_stale error timeout updating invalid_header http_500 http_503;
fastcgi_cache_background_update on;
# Only one request per page goes to PHP on a miss; the rest wait for it.
fastcgi_cache_lock on;
fastcgi_cache_lock_timeout 5s;

# ---------------------------------------------------------------------------
# Bypass rules: 1 = don't serve from cache and don't store.
# ---------------------------------------------------------------------------

map $request_method $cache_skip_method {
    default 1;
    GET     0;
    HEAD    0;
}

# Any query string: search, previews, form results (?reservation=ok), tracking params.
map $args $cache_skip_args {
    default 1;
    ""      0;
}

map $request_uri $cache_skip_uri {
    default                 0;
    ~^/wp-admin/            1;
    ~^/wp-(login|cron|signup|activate)\.php 1;
    ~^/wp-json/             1;
    ~^/xmlrpc\.php          1;
    ~/feed/                 1;
    ~sitemap.*\.xml$        1;
}

# Logged-in users, password-protected posts, commenters see personalized pages.
map $http_cookie $cache_skip_cookie {
    default                    0;
    ~wordpress_logged_in_      1;
    ~wp-postpass_              1;
    ~comment_author_           1;
    ~wordpress_no_cache        1;
}

map "$cache_skip_method$cache_skip_args$cache_skip_uri$cache_skip_cookie" $skip_cache {
    default 1;
    "0000"  0;
}
