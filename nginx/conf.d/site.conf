# Docker's internal DNS. Re-resolve container names so a recreated
# container (new IP) doesn't leave Nginx pointing at a dead address.
resolver 127.0.0.11 valid=10s ipv6=off;

# PHP-FPM backend (the WordPress container, port 9000)
upstream php_backend {
    zone php_backend 64k;
    server wordpress:9000 resolve;
}

server {
    listen 80 default_server;
    server_name _;

    # Same path as inside the WordPress container, so SCRIPT_FILENAME matches
    root /var/www/html;
    index index.php;

    include /etc/nginx/snippets/security.conf;

    # Static files: served directly by Nginx, never reach PHP
    location ~* \.(?:css|js|mjs|jpe?g|png|gif|webp|avif|svg|ico|woff2?|ttf|eot|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # Pretty permalinks: real file -> directory -> hand off to WordPress
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        # Don't pass non-existent PHP files to FPM
        try_files $uri =404;
        include /etc/nginx/snippets/fastcgi-php.conf;
        fastcgi_pass php_backend;

        # Page cache (zone and bypass rules in cache.conf)
        fastcgi_cache WORDPRESS;
        fastcgi_cache_valid 200 301 302 30m;
        fastcgi_cache_valid 404 1m;
        fastcgi_cache_bypass $skip_cache;
        fastcgi_no_cache $skip_cache;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
