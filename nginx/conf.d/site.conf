# Docker's internal DNS. Re-resolve container names so a recreated
# container (new IP) doesn't leave Nginx pointing at a dead address.
resolver 127.0.0.11 valid=10s ipv6=off;

# PHP-FPM backends. "wordpress" resolves to every replica of the service
# (docker-compose.yml: deploy.replicas), so scaling needs no Nginx change.
upstream php_backend {
    zone php_backend 64k;

    # least_conn: send each request to the backend with the fewest active requests.
    # Alternatives: (default) round-robin in turn; ip_hash: same client -> same backend.
    least_conn;

    # After 3 failed attempts, take a backend out of rotation for 10s.
    server wordpress:9000 resolve max_fails=3 fail_timeout=10s;

    # No "keepalive" here on purpose: a PHP-FPM worker serves one connection at a
    # time, so idle kept-alive connections pin workers and new requests stall.
}

server {
    listen 80 default_server;
    server_name _;

    # Same path as inside the WordPress container, so SCRIPT_FILENAME matches
    root /var/www/html;
    index index.php;

    include /etc/nginx/snippets/security.conf;
    include /etc/nginx/snippets/security-headers.conf;

    # Static files: served directly by Nginx, never reach PHP
    location ~* \.(?:css|js|mjs|jpe?g|png|gif|webp|avif|svg|ico|woff2?|ttf|eot|mp4|webm)$ {
        expires 30d;  # Cache-Control: max-age=2592000
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # Pretty permalinks: real file -> directory -> hand off to WordPress
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Brute-force protection: 10 login attempts/minute per IP (burst of 5)
    location = /wp-login.php {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/snippets/fastcgi-php.conf;
        fastcgi_pass php_backend;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Reservation form (and other front-end forms): 6 submissions/minute per IP
    location = /wp-admin/admin-post.php {
        limit_req zone=forms burst=3 nodelay;
        include /etc/nginx/snippets/fastcgi-php.conf;
        fastcgi_pass php_backend;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~ \.php$ {
        # Don't pass non-existent PHP files to FPM
        try_files $uri =404;
        include /etc/nginx/snippets/fastcgi-php.conf;
        fastcgi_pass php_backend;

        # Page cache (zone and bypass rules in cache.conf)
        fastcgi_cache WORDPRESS;
        fastcgi_cache_valid 200 301 302 30m;
        fastcgi_cache_valid 404 1m;
        fastcgi_cache_bypass $skip_cache;
        fastcgi_no_cache $skip_cache;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cloudflare-CDN-Cache-Control $cdn_cache_control always;
        # Which PHP backend answered; only with "X-Debug: 1" (see cache.conf)
        add_header X-Upstream $debug_upstream always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
