# Same uid (33) as PHP-FPM in the WordPress container, so WordPress can
# delete page-cache files that Nginx wrote (see mu-plugins/page-cache.php).
user  www-data;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                      'cache=$upstream_cache_status rt=$request_time "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # Behind Cloudflare Tunnel, requests arrive from the cloudflared container.
    # Trust its CF-Connecting-IP header (only from private Docker networks) so logs
    # and rate limits see the real visitor IP.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   CF-Connecting-IP;

    # Restaurant photos can be large
    client_max_body_size 64m;

    # Compress text responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/rss+xml image/svg+xml font/woff2;

    # Rate limits per visitor IP (real IP, see set_real_ip_from above)
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=forms:10m rate=6r/m;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
