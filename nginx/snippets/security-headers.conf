# Included in every location that sets its own add_header: Nginx drops
# server-level add_header directives in any location that has one.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# A light CSP that can't break WordPress's inline scripts: blocks plugins/objects,
# <base> hijacking, and forms posting to other sites.
add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
