# Never expose config, hidden files, or backups
location = /wp-config.php            { deny all; }
location ~ /\.(?!well-known)         { deny all; }
location ~* \.(?:sql|bak|log|ini|sh|swp|dist)$ { deny all; }

# Old remote-publishing API, a common brute-force target
location = /xmlrpc.php               { deny all; access_log off; }

# No PHP execution inside uploads
location ~* ^/wp-content/uploads/.*\.php$ { deny all; }
