# Redis as a pure cache for WordPress (object cache).

bind 0.0.0.0
# Only reachable on the private Docker network (no port published)
protected-mode no
port 6379

# Hard memory cap; when full, evict the least recently used keys.
maxmemory 128mb
maxmemory-policy allkeys-lru

# It's a cache: no need to persist to disk. If Redis restarts empty, WordPress refills it.
save ""
appendonly no
