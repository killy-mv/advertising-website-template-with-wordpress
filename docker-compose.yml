name: restaurant-wp

# Shared by the WordPress (PHP-FPM) and WP-CLI containers
x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: ${DB_NAME}
  WORDPRESS_DB_USER: ${DB_USER}
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
  WORDPRESS_CONFIG_EXTRA: require_once '/var/www/config/wp-config-extra.php';
  SITE_URL: ${SITE_URL}
  WP_ENVIRONMENT_TYPE: ${WP_ENVIRONMENT_TYPE:-local}
  REDIS_HOST: redis
  NGINX_CACHE_PATH: /var/cache/nginx/wp

# WordPress core lives in a named volume (fast); only our own code is bind-mounted
x-wp-volumes: &wp-volumes
  - wp_files:/var/www/html
  - ./wordpress/themes/restaurant-theme:/var/www/html/wp-content/themes/restaurant-theme
  - ./wordpress/mu-plugins:/var/www/html/wp-content/mu-plugins
  - ./wordpress/wp-config-extra.php:/var/www/config/wp-config-extra.php:ro
  - nginx_cache:/var/cache/nginx/wp

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    # Debian image (not Alpine): its www-data user is uid 33, same as WordPress
    image: nginx:1.29
    restart: unless-stopped
    depends_on:
      - wordpress
    ports:
      - "${HTTP_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - wp_files:/var/www/html:ro
      - ./wordpress/themes/restaurant-theme:/var/www/html/wp-content/themes/restaurant-theme:ro
      - nginx_cache:/var/cache/nginx/wp

  wordpress:
    build: ./wordpress
    image: restaurant-wp/wordpress
    restart: unless-stopped
    # Load balancing: Nginx spreads requests across all replicas.
    # Every replica shares the same DB, Redis, files volume and page cache, so they're interchangeable.
    deploy:
      replicas: 2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *wp-env
    volumes: *wp-volumes

  # One-off admin tool: docker compose run --rm wpcli <command>
  wpcli:
    image: wordpress:cli
    entrypoint: ["wp"]
    profiles: ["tools"]
    user: "33:33"
    environment:
      <<: *wp-env
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - wp_files:/var/www/html
      - ./wordpress/themes/restaurant-theme:/var/www/html/wp-content/themes/restaurant-theme
      - ./wordpress/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./wordpress/wp-config-extra.php:/var/www/config/wp-config-extra.php:ro
      - nginx_cache:/var/cache/nginx/wp
      - ./scripts:/scripts:ro

  # Load testing: see scripts/benchmark.ps1
  k6:
    image: grafana/k6:latest
    profiles: ["tools"]
    volumes:
      - ./benchmarks:/bench

volumes:
  db_data:
  wp_files:
  nginx_cache:
